<!DOCTYPE html>
<html>
<head>
	<meta charset='utf-8'>
	<meta http-equiv='X-UA-Compatible' content='IE=edge'>
	<meta name='viewport' content='width=device-width, initial-scale=1'>
	<title>KurdNet: A Deep Learning-Based System for Recognition of Kurdish Handwritten Characters and Digits</title>
	<script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
	<script src="js/chart.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" >
	<link rel="stylesheet" type="text/css" href="style/digit.css">

<style>
    /* ======= KurdNet Banner Styling ======= */
    header.kurdnet-banner {
        border-bottom: 3px solid #ffc107;
        background: linear-gradient(90deg, #212529, #343a40);
        padding: 20px 0;
        color: white;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    header.kurdnet-banner h2 {
        font-size: 1.9rem;
        font-weight: 700;
        margin: 0;
        letter-spacing: 1px;
    }

    header.kurdnet-banner p {
        margin: 0;
        font-size: 0.95rem;
    }

    header.kurdnet-banner small {
        font-size: 0.75rem;
        color: #e9ecef;
    }

    header.kurdnet-banner .btn-outline-light {
        border-width: 1px;
        padding: 4px 10px;
        font-size: 0.8rem;
    }
</style>



</head>
<body>
	<header class="kurdnet-banner">
    <div class="container d-flex flex-column flex-md-row align-items-center justify-content-between">
        <h2>KurdNet</h2>

        <div class="text-center text-md-right">
           
        </div>

        <div class="mt-3 mt-md-0">
            <a href="doc.html" class="btn btn-outline-light btn-sm mx-1">Documentation</a>
            <a href="https://github.com/Peshraw1/Deep-learning-based-recognition-of-Kurdish-handwritten-characters-and-digits" class="btn btn-outline-light btn-sm mx-1">GitHub</a>
        </div>
    </div>
</header>


<!-- ======= End Banner Section ======= -->

	<main>
		<div class="container mt-1">
			<div class="digit-demo-container">
				<h3>KurdNet: A Deep Learning-Based System for Recognition of Kurdish Handwritten Characters and Digits</h3>
					<div class="flex-two">
						<div id="canvas_box_wrapper" class="canvas-box-wrapper">
							<div id="canvas_box" class="canvas-box"></div>
							<div class="col-12">
								<button id="clear-button" class="btn btn-dark">Clear</button>
							</div>
							<div class="col-12">
								<button id="predict-button" class="btn btn-dark">Predict</button>
							</div>
						</div>
						<div class="col-6">
							<div id="result_box" class="col-12 col-md-7">
								<canvas id="chart_box" width="500" height="500"></canvas>
							</div>
							<div class="col-12 d-block mt-2 mt-md-0 text-md-left prediction-text"></div>
						</div>
					</div>
			</div>
		</div>
	</main>   

	<script src="js/digit-recognition.js"></script>
</body>
</html>
